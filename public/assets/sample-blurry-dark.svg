<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Dark and blurry photo that cannot be verified">
  <defs>
    <filter id="blurry">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>
  <rect width="640" height="400" fill="#1a1c20" />
  <g filter="url(#blurry)" opacity="0.6">
    <rect x="60" y="90" width="220" height="240" fill="#2b2f38" />
    <rect x="330" y="140" width="250" height="190" fill="#323741" />
    <circle cx="480" cy="70" r="24" fill="#ffc72c" opacity="0.35" />
    <line x1="20" y1="350" x2="620" y2="310" stroke="#5b5f66" stroke-width="18" />
  </g>
  <rect x="160" y="160" width="320" height="80" rx="16" fill="#17181b" opacity="0.82" stroke="#5b5f66" stroke-width="2" />
  <text x="320" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f5f5f3">Too dark / blurry</text>
  <text x="320" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#b3b7bf">AI cannot verify clearly</text>
  <rect x="20" y="20" width="130" height="32" rx="16" fill="#17181b" opacity="0.9" />
  <text x="85" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffc72c">SAMPLE DATA</text>
</svg>
