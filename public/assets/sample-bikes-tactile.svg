<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Parked motorbikes blocking yellow tactile footpath tiles">
  <rect width="640" height="400" fill="#d8d6cf" />
  <rect x="0" y="250" width="640" height="150" fill="#b7b4aa" />
  <!-- Yellow tactile guide tiles -->
  <g fill="#ffc72c" stroke="#c8960c" stroke-width="2">
    <rect x="40" y="285" width="90" height="54" rx="4" />
    <rect x="138" y="285" width="90" height="54" rx="4" />
    <rect x="236" y="285" width="90" height="54" rx="4" />
    <rect x="334" y="285" width="90" height="54" rx="4" />
    <rect x="432" y="285" width="90" height="54" rx="4" />
    <rect x="530" y="285" width="90" height="54" rx="4" />
  </g>
  <!-- Parked motorbike 1 blocking tiles -->
  <g transform="translate(215, 175)">
    <circle cx="38" cy="128" r="28" fill="#1f2125" stroke="#5b5f66" stroke-width="5" />
    <circle cx="152" cy="128" r="28" fill="#1f2125" stroke="#5b5f66" stroke-width="5" />
    <path d="M40 124 L84 68 L135 68 L152 124 Z" fill="#d6382c" />
    <rect x="64" y="54" width="54" height="16" rx="7" fill="#17181b" />
    <line x1="125" y1="68" x2="146" y2="34" stroke="#17181b" stroke-width="7" stroke-linecap="round" />
    <rect x="134" y="28" width="28" height="10" rx="5" fill="#17181b" />
  </g>
  <!-- Parked scooter 2 -->
  <g transform="translate(385, 185)">
    <circle cx="34" cy="118" r="24" fill="#1f2125" stroke="#5b5f66" stroke-width="4" />
    <circle cx="130" cy="118" r="24" fill="#1f2125" stroke="#5b5f66" stroke-width="4" />
    <path d="M36 112 L68 58 L112 62 L126 112 Z" fill="#3a6ea5" />
    <rect x="56" y="46" width="44" height="14" rx="6" fill="#17181b" />
  </g>
  <!-- Sample tag badge -->
  <rect x="20" y="20" width="130" height="32" rx="16" fill="#17181b" opacity="0.85" />
  <text x="85" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffc72c">SAMPLE DATA</text>
</svg>
